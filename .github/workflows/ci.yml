name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No install step: this package has no dependencies.
      - name: Run tests
        run: node --test

      - name: Lint the project's own .gitignore
        run: node bin/gitignore-lint.js .gitignore --strict --no-color